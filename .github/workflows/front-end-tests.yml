name: App tests

on:
  pull_request:
    paths:
      - 'front_end/**'
      - 'api/**'
      - 'task/**'
      - 'sql_queries/**'
      - 'linux_host/**'
      - 'custom_script_extensions/**'
      - 'deploy/bicep/**'
      - '.github/workflows/front-end-tests.yml'
  push:
    paths:
      - 'front_end/**'
      - 'api/**'
      - 'task/**'
      - 'sql_queries/**'
      - 'linux_host/**'
      - 'custom_script_extensions/**'
      - 'deploy/bicep/**'
      - '.github/workflows/front-end-tests.yml'

jobs:
  front-end-web:
    name: Portal bundle (React)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node version
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front_end/web/package-lock.json

      - name: Install dependencies
        working-directory: front_end/web
        run: npm ci

      - name: Type check
        working-directory: front_end/web
        run: npm run typecheck

      - name: Run vitest
        working-directory: front_end/web
        run: npm test

      # Catches a bundle that type checks but cannot actually be built, which is
      # what the container image does during `az acr build`.
      - name: Build the production bundle
        working-directory: front_end/web
        run: npm run build

  front-end-test:
    name: Portal BFF (Flask)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: front_end
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        working-directory: front_end
        env:
          FLASK_KEY: test-secret-key
          CLIENT_ID: client-id
          TENANT_ID: tenant-id
          API_CLIENT_ID: api-client-id
          API_URL: https://api.example.invalid
          MICROSOFT_PROVIDER_AUTHENTICATION_SECRET: secret
        run: pytest

  api-test:
    name: Broker API
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        working-directory: api
        env:
          TENANT_ID: tenant-id
          CLIENT_ID: client-id
          VM_SUBSCRIPTION_ID: subscription-id
          VM_RESOURCE_GROUP: resource-group
          AVD_HOST_GROUP_ID: avd-group-id
          LINUX_HOST_GROUP_ID: linux-group-id
          DOMAIN_NAME: example.invalid
          VAULT_URL: https://vault.example.invalid
          KEY_NAME: ssh-key
          DB_SERVER: db.example.invalid
          DB_DATABASE: LinuxBrokerTest
          DB_USERNAME: api-user
          DB_PASSWORD_NAME: db-password
          MICROSOFT_PROVIDER_AUTHENTICATION_SECRET: provider-secret
          NFS_SHARE: /mnt/test
        run: pytest

  sql-test:
    name: SQL scripts and Broker API against SQL Server
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # A throwaway server for this job only; the password is not a secret.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'LinuxBroker-CI-Only-1!'
        ports:
          - 1433:1433

    env:
      SQL_TEST_SERVER: localhost:1433
      SQL_TEST_USER: sa
      SQL_TEST_PASSWORD: 'LinuxBroker-CI-Only-1!'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sql_queries/tests/requirements.txt -r api/requirements.txt -r api/requirements-dev.txt

      - name: Wait for SQL Server
        run: |
          python -c "
          import time, pymssql
          for attempt in range(90):
              try:
                  pymssql.connect(server='localhost', port=1433, user='sa', password='LinuxBroker-CI-Only-1!', database='master').close()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit('SQL Server did not accept connections in time.')
          "

      # Applies every script twice, with READ_COMMITTED_SNAPSHOT on as in Azure SQL.
      - name: Run the SQL contract tests
        run: pytest sql_queries/tests -q

      - name: Run the Broker API against SQL Server
        working-directory: api
        run: pytest tests_integration -q

  host-scripts:
    name: Linux host scripts
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Also lints the bootstrap scripts in custom_script_extensions.
      - name: Run the host script tests
        run: bash linux_host/tests/run.sh

  bicep-build:
    name: Bicep templates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Compile only. main.json is regenerated with the template changes, and its exact
      # contents depend on the Bicep version, so it is not compared here.
      - name: Build the Bicep templates
        run: |
          az bicep install
          az bicep build --file deploy/bicep/main.bicep --stdout > /dev/null

  task-test:
    name: Scheduled task function
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r task/requirements.txt -r task/requirements-dev.txt

      - name: Run pytest
        run: pytest task/tests -q
